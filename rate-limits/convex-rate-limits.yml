description: Convex limits are expressed primarily as concurrency (queries, mutations, actions, scheduled
  jobs) and per-function execution constraints rather than per-second request rates. Concurrency capacity
  is bound to the deployment instance class (S16, S256, D1024). Plan-level monthly quotas (function
  calls, GB-hours of action compute, etc.) are documented in the plans artifact and act as soft quotas
  with pay-as-you-go overage rather than hard throttles.
