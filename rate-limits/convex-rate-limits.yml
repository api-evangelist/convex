policies:
  - name: Concurrency, not RPS
    description: Convex throttles primarily on concurrent function executions and connections per deployment
      instance class rather than fixed requests-per-second. Scale up by upgrading the instance class
      or upgrading the plan.
  - name: Soft monthly quotas
    description: Plan quotas (function calls, action compute, storage, egress) are soft. Usage above
      the included amount is billed at the published per-unit overage rate rather than throttled.
  - name: Action timeout
    description: Long-running work belongs in actions (10-minute ceiling), not queries or mutations
      (1-second user-code limit).
  - name: Backoff Strategy
    description: Clients should implement exponential backoff with jitter on 429 and 5xx responses;
      the Convex client SDKs do this automatically.
  - name: Fair Use
    description: Even on Business/Enterprise contracts, sustained usage that materially impacts shared
      infrastructure may be subject to fair-use throttling.
