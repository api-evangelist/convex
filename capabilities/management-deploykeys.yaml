naftiko: 1.0.0-alpha2
info:
  label: Convex Management API — DeployKeys
  description: 'Convex Management API — DeployKeys. 2 operations. Lead operation: List deploy keys for a project. Self-contained
    Naftiko capability covering one Convex business surface.'
  tags:
  - Convex
  - DeployKeys
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CONVEX_API_KEY: CONVEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-deploykeys
    baseUri: https://api.convex.dev/v1
    description: Convex Management API — DeployKeys business capability. Self-contained, no shared references.
    resources:
    - name: projects-project_id-deployment-deploy_key-list
      path: /projects/{project_id}/deployment/deploy_key/list
      operations:
      - name: listdeploykeys
        method: GET
        description: List deploy keys for a project
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: projects-project_id-deployments-create_deploy_key
      path: /projects/{project_id}/deployments/create_deploy_key
      operations:
      - name: createdeploykey
        method: POST
        description: Create a deploy key
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.CONVEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: management-deploykeys-rest
    port: 8080
    description: REST adapter for Convex Management API — DeployKeys. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/projects/{project-id}/deployment/deploy-key/list
      name: projects-project-id-deployment-deploy-key-list
      description: REST surface for projects-project_id-deployment-deploy_key-list.
      operations:
      - method: GET
        name: listdeploykeys
        description: List deploy keys for a project
        call: management-deploykeys.listdeploykeys
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/projects/{project-id}/deployments/create-deploy-key
      name: projects-project-id-deployments-create-deploy-key
      description: REST surface for projects-project_id-deployments-create_deploy_key.
      operations:
      - method: POST
        name: createdeploykey
        description: Create a deploy key
        call: management-deploykeys.createdeploykey
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-deploykeys-mcp
    port: 9090
    transport: http
    description: MCP adapter for Convex Management API — DeployKeys. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-deploy-keys-project
      description: List deploy keys for a project
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: management-deploykeys.listdeploykeys
      outputParameters:
      - type: object
        mapping: $.
    - name: create-deploy-key
      description: Create a deploy key
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: management-deploykeys.createdeploykey
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
