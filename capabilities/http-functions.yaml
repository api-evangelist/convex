naftiko: 1.0.0-alpha2
info:
  label: Convex HTTP API — Functions
  description: 'Convex HTTP API — Functions. 1 operations. Lead operation: Execute any function by identifier. Self-contained
    Naftiko capability covering one Convex business surface.'
  tags:
  - Convex
  - Functions
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CONVEX_API_KEY: CONVEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: http-functions
    baseUri: https://{deploymentName}.convex.cloud
    description: Convex HTTP API — Functions business capability. Self-contained, no shared references.
    resources:
    - name: api-run-functionIdentifier
      path: /api/run/{functionIdentifier}
      operations:
      - name: runfunction
        method: POST
        description: Execute any function by identifier
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.CONVEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: http-functions-rest
    port: 8080
    description: REST adapter for Convex HTTP API — Functions. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/api/run/{functionidentifier}
      name: api-run-functionidentifier
      description: REST surface for api-run-functionIdentifier.
      operations:
      - method: POST
        name: runfunction
        description: Execute any function by identifier
        call: http-functions.runfunction
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: http-functions-mcp
    port: 9090
    transport: http
    description: MCP adapter for Convex HTTP API — Functions. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: execute-any-function-identifier
      description: Execute any function by identifier
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: http-functions.runfunction
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
