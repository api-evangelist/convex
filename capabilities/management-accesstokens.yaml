naftiko: 1.0.0-alpha2
info:
  label: Convex Management API — AccessTokens
  description: 'Convex Management API — AccessTokens. 1 operations. Lead operation: Create a team access token. Self-contained
    Naftiko capability covering one Convex business surface.'
  tags:
  - Convex
  - AccessTokens
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CONVEX_API_KEY: CONVEX_API_KEY
capability:
  consumes:
  - type: http
    namespace: management-accesstokens
    baseUri: https://api.convex.dev/v1
    description: Convex Management API — AccessTokens business capability. Self-contained, no shared references.
    resources:
    - name: teams-team_id-create_access_token
      path: /teams/{team_id}/create_access_token
      operations:
      - name: createaccesstoken
        method: POST
        description: Create a team access token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.CONVEX_API_KEY}}'
  exposes:
  - type: rest
    namespace: management-accesstokens-rest
    port: 8080
    description: REST adapter for Convex Management API — AccessTokens. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/teams/{team-id}/create-access-token
      name: teams-team-id-create-access-token
      description: REST surface for teams-team_id-create_access_token.
      operations:
      - method: POST
        name: createaccesstoken
        description: Create a team access token
        call: management-accesstokens.createaccesstoken
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: management-accesstokens-mcp
    port: 9090
    transport: http
    description: MCP adapter for Convex Management API — AccessTokens. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: create-team-access-token
      description: Create a team access token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: management-accesstokens.createaccesstoken
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
