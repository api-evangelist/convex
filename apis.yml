name: Convex
kind: company
description: >-
  Convex is a serverless backend platform that provides a real-time database, cloud functions, and infrastructure for
  building modern web and mobile applications. It offers a TypeScript-first developer experience with reactive queries,
  transactional mutations, and integrated file storage, all accessible through a suite of HTTP, management, and
  deployment APIs alongside JavaScript and server SDKs for full-stack application development. The platform is SOC 2
  Type II, HIPAA, and GDPR compliant.
