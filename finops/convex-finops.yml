principles:
  - name: Visibility
    description: Use the Convex dashboard usage views and per-deployment metrics to track function
      calls, action compute (GB-hours), storage, and egress. Export usage from the Management API
      and join to FOCUS-aligned billing exports for per-team allocation.
  - name: Allocation
    description: Allocate cost by deployment, environment (dev / preview / prod), and team. Tag deployments
      using project naming conventions; the Management API exposes deployment-level usage that can be
      broken down by environment and function.
  - name: Optimization
    description: Move long-running or third-party-fanout work into actions (avoid the 1s mutation budget),
      cache reactive query results on the client, narrow document scans with indexes (32k scan ceiling),
      keep file/search storage tidy, and consider the CPU-time pricing model on Business/Enterprise
      for compute-heavy workloads.
  - name: Accountability
    description: Set monthly soft quotas and overage budgets per deployment/environment; designate
      a Convex billing owner per project; alert on action GB-hours and database I/O spikes that historically
      drive overage.
