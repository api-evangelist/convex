description: Convex uses a hybrid plan model with a free Starter tier (no card required), a Professional
  tier billed at $25 per developer/month, and Business/Enterprise contracts starting at a $2,500 monthly
  minimum. Each plan bundles included quotas across function calls, database storage and I/O, file storage,
  search storage and queries, action compute, and egress. Usage above the included quota is billed via
  pay-as-you-go overage rates.
sources:
  - https://www.convex.dev/pricing
  - https://docs.convex.dev/production/state/limits
plans:
  - id: convex-starter
    name: Starter
    type: freemium
    description: Free tier (no credit card) for evaluation, prototyping, and small production apps.
      Pay-as-you-go overages available without upgrading.
