        name: function_calls_included
        type: quota
        metric: request
        limit: 1000000
        timeFrame: month
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Function calls (overage)
        name: function_calls_overage
        type: metered
        metric: request
        limit: -1
        timeFrame: month
        geo: global
        unit: 1000000
